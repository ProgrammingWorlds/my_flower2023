<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Flower | ماي فلاور</title>
<meta name="description" content="My Flower – باقات ورد وتنسيقات للمناسبات مع توصيل | Fresh bouquets and floral arrangements with delivery.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#3E1420; --peony:#B83A55; --peony-d:#96283F; --blush:#FBEFEE; --sage:#6F8F72; --gold:#B8925A; --paper:#FFFCFB; --ink:#2F2226; --line:#EFDCDD;
  --bg:var(--paper); --text:var(--ink); --card:#fff;
  --f-head:'Aref Ruqaa','Cormorant Garamond',Georgia,serif; --f-body:'Tajawal',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#171214;--text:#F1E4EA;--card:#231B1E;--line:#3D3236;--blush:#231B1E}
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--f-body);background:var(--bg);color:var(--text);line-height:1.7;font-size:17px}
html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] h3,html[lang="en"] .logo{font-family:'Cormorant Garamond',Georgia,serif}
h1,h2,h3,.logo{font-family:var(--f-head);line-height:1.25;font-weight:700}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--peony);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
section{padding:72px 0}

/* header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:66px}
.logo{display:flex;align-items:center;gap:10px;font-size:1.5rem;text-decoration:none;color:var(--peony)}
.logo img{height:40px;width:40px;border-radius:50%;object-fit:cover}
nav{display:flex;gap:22px;font-weight:500}
nav a{text-decoration:none;font-size:.98rem}
nav a:hover{color:var(--peony)}
.tools{display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line);background:transparent;color:inherit;border-radius:99px;padding:6px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.pill:hover{border-color:var(--peony);color:var(--peony)}
@media(max-width:760px){nav{display:none}}

/* hero */
.hero{padding:56px 0 72px;background:radial-gradient(900px 500px at 85% 10%,var(--blush),transparent 70%)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2.3rem,6vw,4.1rem);margin-bottom:18px}
.hero p{font-size:1.15rem;max-width:34em;opacity:.85;margin-bottom:28px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:99px;background:var(--peony);color:#fff;text-decoration:none;font-weight:700;border:2px solid var(--peony);transition:background .2s}
.btn:hover{background:var(--peony-d);border-color:var(--peony-d)}
.btn.ghost{background:transparent;color:var(--peony)}
.btn.ghost:hover{background:var(--peony);color:#fff}
.bloom{width:100%;max-width:440px;margin:auto}
.bloom svg{width:100%;height:auto;overflow:visible}
.bloom .petal{transform-origin:200px 200px;opacity:0;animation:open 1.6s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*90ms)}
@keyframes open{from{opacity:0;transform:rotate(calc(var(--r)*1deg - 60deg)) scale(.2)}to{opacity:1;transform:rotate(calc(var(--r)*1deg)) scale(1)}}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr}.collage{max-width:340px}}

/* headings */
.head{text-align:center;margin-bottom:40px}
.head h2{font-size:clamp(1.8rem,4vw,2.6rem)}
.head p{opacity:.75;max-width:32em;margin:8px auto 0}

/* filters + products */
.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:32px}
.filters .pill.on{background:var(--plum);color:#fff;border-color:var(--plum)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .filters .pill.on{background:var(--peony);border-color:var(--peony)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:4/5;background:linear-gradient(160deg,var(--c1),var(--c2));display:grid;place-items:center;position:relative}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph svg{width:46%;opacity:.55}
.info{padding:16px 18px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{font-size:1.25rem}
.info .desc{font-size:.93rem;opacity:.75;flex:1}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.price{font-weight:700;color:var(--peony);font-size:1.1rem}
.order{font-size:.9rem;text-decoration:none;background:var(--plum);color:#fff;padding:8px 16px;border-radius:99px}
.order:hover{background:var(--peony)}

/* about + steps */
.about{background:var(--blush)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.two h2{font-size:clamp(1.8rem,4vw,2.5rem);margin-bottom:14px}
.two p{opacity:.85;margin-bottom:12px}
.steps{list-style:none;counter-reset:s;display:grid;gap:16px}
.steps li{counter-increment:s;display:flex;gap:16px;align-items:flex-start;background:var(--card);border:1px solid var(--line);padding:16px 18px;border-radius:16px}
.steps li::before{content:counter(s);flex:none;width:36px;height:36px;border-radius:50%;background:var(--plum);color:#fff;display:grid;place-items:center;font-weight:700}
.steps b{display:block}
@media(max-width:820px){.two{grid-template-columns:1fr}}

/* contact */
.contact .box{background:var(--plum);color:#fff;border-radius:28px;padding:48px 28px;text-align:center}
.contact h2{font-size:clamp(1.8rem,4vw,2.5rem);margin-bottom:8px}
.contact .list{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 32px;margin:24px 0 30px;opacity:.92}
.contact .btn.ghost{color:#fff;border-color:#fff}
.contact .btn.ghost:hover{background:#fff;color:var(--plum)}
footer{padding:28px 0;text-align:center;font-size:.9rem;opacity:.7}
.fab{position:fixed;bottom:18px;inset-inline-start:18px;z-index:30;width:56px;height:56px;border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.fab svg{width:30px;height:30px;fill:#fff}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bloom .petal{animation:none;opacity:1;transform:rotate(calc(var(--r)*1deg))}}

body{overflow-x:hidden}
.collage{position:relative;max-width:420px;width:100%;margin:auto;padding-bottom:28px}
.arch{border-radius:999px 999px 28px 28px;overflow:hidden;aspect-ratio:4/5;box-shadow:0 26px 50px -22px rgba(31,27,29,.5)}
.arch img{width:100%;height:100%;object-fit:cover}
.mini{position:absolute;width:36%;aspect-ratio:1;object-fit:cover;border-radius:50%;border:6px solid var(--bg);box-shadow:0 12px 26px -10px rgba(0,0,0,.4)}
.m1{bottom:0;inset-inline-start:-4%}.m2{top:10%;inset-inline-end:-4%}
.hdwa{background:#25D366;border-color:#25D366;color:#fff;text-decoration:none}
.hdwa:hover{background:#1DA851;color:#fff;border-color:#1DA851}
.tools .ig{text-decoration:none}
.ph img{transition:transform .5s}.card:hover .ph img{transform:scale(1.05)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tiles a{aspect-ratio:1;overflow:hidden;border-radius:14px;display:block}
.tiles img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.tiles a:hover img{transform:scale(1.07)}
@media(max-width:520px){.tools .ig{display:none}}

.head h2::after{content:"";display:block;width:56px;height:2px;background:var(--gold);margin:14px auto 0}
.tiles{grid-template-columns:repeat(4,1fr);grid-auto-rows:190px}
.tiles button{border:0;padding:0;background:none;overflow:hidden;border-radius:16px;cursor:zoom-in}
.tiles button:nth-child(1){grid-area:1/1/3/3}
.tiles button:nth-child(4){grid-column:3/5}
.tiles button:nth-child(5){grid-column:1/3}
.tiles button:nth-child(6){grid-column:3/5}
.tiles button:hover img{transform:scale(1.07)}
.ph img{cursor:zoom-in}
@media(max-width:700px){
  .tiles{grid-template-columns:repeat(2,1fr);grid-auto-rows:150px}
  .tiles button:nth-child(n){grid-area:auto}
  .tiles button:nth-child(1){grid-area:span 2/span 2}
  .tiles button:nth-child(6){grid-column:span 2}
}
#lb{position:fixed;inset:0;z-index:50;background:rgba(20,10,14,.88);display:none;place-items:center;padding:20px;cursor:zoom-out}
#lb.on{display:grid}
#lb img{max-width:100%;max-height:90vh;border-radius:14px}
</style>
</head>

function drawBloom(){
  const cols = ["#C62F4B","#E27A8D","#F2B8C1"], n = 12;
  let s = "";
  for(let i = 0; i < n; i++){
    const r = i * 360 / n, c = cols[i % 3], k = i % 2 ? 0 : 1;
    s += `<g class="petal" style="--i:${i};--r:${r};transform:rotate(${r}deg)"><ellipse cx="200" cy="${k ? 105 : 130}" rx="${k ? 34 : 28}" ry="${k ? 82 : 62}" fill="${c}" opacity="${k ? .85 : .95}"/></g>`;
  }
  $("#bloom").innerHTML = s + '<circle cx="200" cy="200" r="26" fill="#1F1B1D"/><circle cx="200" cy="200" r="10" fill="#F6E9EF"/>';
}

function renderShop(){
  $("#filters").innerHTML = Object.keys(CATS).map(k =>
    `<button class="pill ${k === cat ? "on" : ""}" data-cat="${k}">${CATS[k][lang]}</button>`).join("");
  $("#grid").innerHTML = PRODUCTS.filter(p => cat === "all" || p.cat === cat).map(p => {
    const [name, desc] = p[lang];
    const media = p.img ? `<img src="${p.img}" alt="${name}" loading="lazy">` : flowerSvg;
    return `<article class="card"><div class="ph" style="--c1:${p.c[0]};--c2:${p.c[1]}">${media}</div>
      <div class="info"><h3>${name}</h3><p class="desc">${desc}</p>
      <div class="row"><span class="price">${p.price ? p.price + " " + CONFIG.currency[lang] : T[lang].ask}</span>
      <a class="order" target="_blank" rel="noopener" href="${wa(T[lang].msg + name)}">${T[lang].order}</a></div></div></article>`;
  }).join("");
  $$("#filters .pill").forEach(b => b.onclick = () => { cat = b.dataset.cat; renderShop(); });
}

function applyLang(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  $$("[data-i18n]").forEach(el => el.textContent = T[lang][el.dataset.i18n]);
  $("#langBtn").textContent = lang === "ar" ? "EN" : "عربي";
  $("#cAddr").textContent = CONFIG.address[lang];
  $("#cHours").textContent = CONFIG.hours[lang];
  document.title = lang === "ar" ? "ماي فلاور | ورد وتنسيقات" : "My Flower | Fresh flowers";
  renderShop();
}

$("#langBtn").onclick = () => { lang = lang === "ar" ? "en" : "ar"; try{localStorage.setItem("mf-lang", lang)}catch(e){} applyLang(); };
try{ const l = localStorage.getItem("mf-lang"); if(l) lang = l; }catch(e){}

$$(".wa").forEach(a => a.href = wa(lang === "ar" ? "مرحباً، بدي أستفسر عن الورد" : "Hello, I have a question about flowers"));
$("#cPhone").textContent = CONFIG.phone; $("#cPhone").href = "tel:" + CONFIG.phone.replace(/\s/g, "");
$("#igLink").href = CONFIG.instagram;
$("#yr").textContent = new Date().getFullYear();
if(CONFIG.logo){ const i = $("#logoImg"); i.src = CONFIG.logo; i.hidden = false; }
["h1","h2","h3"].forEach((id,i)=>{$("#"+id).src=IMG[[3,2,7][i]]});
$("#tiles").innerHTML=[1,2,4,5,6,7].map(n=>`<button type="button" aria-label="Zoom"><img src="${IMG[n]}" alt="" loading="lazy"></button>`).join("");
$$(".ig").forEach(a=>{a.href=CONFIG.instagram;a.target="_blank";a.rel="noopener"});
applyLang();

document.addEventListener("click",e=>{
  const a=e.target.closest('a[href^="#"]');
  if(a){e.preventDefault();const id=a.getAttribute("href").slice(1);const t=id&&document.getElementById(id);
    if(t)t.scrollIntoView({behavior:"smooth",block:"start"});else if(!id||a.classList.contains("logo"))window.scrollTo({top:0,behavior:"smooth"});return;}
  const im=e.target.closest(".ph img, .tiles img");
  if(im){$("#lb img").src=im.src;$("#lb").classList.add("on");return;}
  if(e.target.closest("#lb"))$("#lb").classList.remove("on");
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#lb").classList.remove("on")});
</script>
